<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pedidos Vivenda dos Sucos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧃</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap');

:root{
  --fundo:#f5f7f0; --superficie:#ffffff; --superficie2:#edf0e4; --borda:#dae0cd;
  --tinta:#1b2116; --fraca:#656e59; --primaria:#3d7a41; --primaria-forte:#2d5c31;
  --sobre-primaria:#ffffff; --acento:#7f9418; --perigo:#a5402c; --ok:#2f7d4f;
  --sombra:0 1px 2px rgba(27,33,22,.06), 0 8px 24px -12px rgba(27,33,22,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fundo:#11160d; --superficie:#191f14; --superficie2:#222a1a; --borda:#343e29;
    --tinta:#e9eee0; --fraca:#98a189; --primaria:#79b47d; --primaria-forte:#a3d0a5;
    --sobre-primaria:#10160c; --acento:#c3dc46; --perigo:#e5907c; --ok:#7fd3a0;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --fundo:#11160d; --superficie:#191f14; --superficie2:#222a1a; --borda:#343e29;
  --tinta:#e9eee0; --fraca:#98a189; --primaria:#79b47d; --primaria-forte:#a3d0a5;
  --sobre-primaria:#10160c; --acento:#c3dc46; --perigo:#e5907c; --ok:#7fd3a0;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--fundo); color:var(--tinta);
  font-family:Archivo,"Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
}
.env{max-width:680px; margin:0 auto; padding:20px 16px 136px}

.topo{display:flex; align-items:center; gap:14px; margin-bottom:10px; padding-bottom:14px; border-bottom:1px solid var(--borda)}
.topo h1{font-family:"Instrument Serif",Georgia,serif; font-weight:400; font-size:32px; line-height:1.05; margin:0; letter-spacing:-.01em}
.chapa{background:#fff; border-radius:10px; padding:7px 9px; flex:0 0 auto; display:inline-flex; align-items:center; line-height:0; box-shadow:0 1px 2px rgba(27,33,22,.10)}
.chapa img{display:block; height:44px; width:auto}
.sub{color:var(--fraca); font-size:14px; margin:0 0 14px}
.papel{display:flex; align-items:center; gap:9px; margin:0 0 22px; font-size:13px; color:var(--fraca)}
.papel .quem{font-weight:600; color:var(--tinta); border:1px solid var(--borda); background:var(--superficie2); padding:4px 11px; border-radius:99px}
.papel button{background:none; border:0; color:var(--fraca); text-decoration:underline; cursor:pointer; font-size:13px; padding:0}
.papel button:hover{color:var(--tinta)}

.porta{max-width:420px; margin:12vh auto 0; padding:0 16px; text-align:center}
.porta .chapa{margin:0 auto 22px; padding:11px 14px}
.porta .chapa img{height:62px}
.porta h1{font-family:"Instrument Serif",Georgia,serif; font-weight:400; font-size:38px; margin:0 0 6px}
.porta p{color:var(--fraca); font-size:15px; margin:0 0 24px}

.bloco{background:var(--superficie); border:1px solid var(--borda); border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:var(--sombra)}
.bloco.destaque{border-color:color-mix(in srgb,var(--acento) 55%,var(--borda))}
.rot{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--fraca); font-weight:600; margin:0 0 10px}
.bloco.destaque .rot{color:var(--acento)}

input,button,select{font:inherit; color:inherit}
.campo{width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--borda); background:var(--superficie2); color:var(--tinta)}
.campo:focus-visible,button:focus-visible{outline:2px solid var(--primaria); outline-offset:2px}

.busca{position:relative}
.lista{position:absolute; z-index:9; left:0; right:0; top:calc(100% + 5px); background:var(--superficie); border:1px solid var(--borda); border-radius:10px; box-shadow:var(--sombra); max-height:min(52vh,340px); overflow-y:auto; padding:5px}
.lista:empty{display:none}
.opt{display:block; width:100%; text-align:left; background:none; border:0; padding:9px 10px; border-radius:7px; cursor:pointer; line-height:1.3}
.opt:hover,.opt:focus-visible{background:var(--superficie2)}
.opt b{font-weight:600; display:block; font-size:14px}
.opt span{font-size:12px; color:var(--fraca)}
.escolhido{display:flex; gap:12px; align-items:flex-start; justify-content:space-between; background:var(--superficie2); border:1px solid var(--borda); border-left:3px solid var(--primaria); border-radius:9px; padding:11px 13px}
.escolhido b{display:block; font-size:14px; font-weight:600}
.escolhido span{font-size:12px; color:var(--fraca)}

.grupo + .grupo{margin-top:18px}
.grupo h3{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--acento); font-weight:700; margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid var(--borda)}
.item{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--borda)}
.item:last-child{border-bottom:0}
.item.tem{background:linear-gradient(90deg,color-mix(in srgb,var(--acento) 12%,transparent),transparent); border-radius:6px; padding-left:8px; margin-left:-8px}
.item .nome{font-size:14px; line-height:1.25}
.item .preco{font-size:12px; color:var(--fraca); font-variant-numeric:tabular-nums}
.qtd{width:82px; padding:9px 10px; text-align:center; border-radius:8px; border:1px solid var(--borda); background:var(--superficie2); font-variant-numeric:tabular-nums; font-weight:600}
.qtd::-webkit-outer-spin-button,.qtd::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qtd[type=number]{-moz-appearance:textfield}

.btn{border:1px solid var(--borda); background:var(--superficie2); color:var(--tinta); padding:11px 16px; border-radius:9px; cursor:pointer; font-weight:600; font-size:15px}
.btn:hover{border-color:var(--primaria)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.principal{background:var(--primaria); border-color:var(--primaria); color:var(--sobre-primaria)}
.btn.principal:hover{background:var(--primaria-forte); border-color:var(--primaria-forte)}
.btn.miudo{padding:6px 11px; font-size:13px; font-weight:500}
.btn.perigo{color:var(--perigo)}
.btn.perigo:hover{border-color:var(--perigo)}
.btn.marcado{background:var(--primaria); border-color:var(--primaria); color:var(--sobre-primaria)}
.btn.marcado-nao{background:var(--perigo); border-color:var(--perigo); color:#fff}
.btn.largo{width:100%}
.acoes{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px}

.pedido{border:1px solid var(--borda); border-radius:10px; padding:12px 14px; background:var(--superficie); margin-bottom:10px}
.pedido.pendendo{border-left:3px solid var(--acento)}
.pedido.vai-sim{border-left:3px solid var(--primaria); background:color-mix(in srgb,var(--primaria) 6%,var(--superficie))}
.pedido.vai-nao{border-left:3px solid var(--perigo); opacity:.72}
.pedido.vai-fora{border-left:3px solid var(--perigo); opacity:.55}
.pedido.vai-fora .cli{text-decoration:line-through}
.pedido .cab{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.pedido .cli{font-weight:600; font-size:15px; line-height:1.25}
.pedido .loc{font-size:12px; color:var(--fraca)}
.pedido ul{margin:9px 0 0; padding:0; list-style:none; font-size:13.5px}
.pedido li{display:flex; justify-content:space-between; gap:12px; padding:2px 0; color:var(--fraca)}
.pedido li b{color:var(--tinta); font-weight:600; font-variant-numeric:tabular-nums}
.total{display:flex; justify-content:space-between; margin-top:9px; padding-top:9px; border-top:1px dashed var(--borda); font-size:14px; font-variant-numeric:tabular-nums}
.selo{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; padding:4px 9px; border-radius:99px; white-space:nowrap; border:1px solid}
.selo.fila{color:var(--fraca); border-color:var(--borda)}
.selo.anotado{color:var(--acento); border-color:color-mix(in srgb,var(--acento) 45%,transparent)}
.selo.autorizado{color:var(--primaria); border-color:color-mix(in srgb,var(--primaria) 50%,transparent)}
.selo.emitida{color:var(--ok); border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.selo.erro{color:var(--perigo); border-color:color-mix(in srgb,var(--perigo) 45%,transparent)}
.nota{font-size:12.5px; color:var(--fraca); margin-top:7px; font-variant-numeric:tabular-nums}
.vazio{color:var(--fraca); font-size:14px; padding:6px 0}

.cfop{margin-top:10px; padding-top:10px; border-top:1px dashed var(--borda)}
.cfop .rot{color:var(--acento); font-variant-numeric:tabular-nums}
.marcaTela{color:var(--perigo); border:1px solid color-mix(in srgb,var(--perigo) 45%,transparent); border-radius:99px; padding:2px 8px; margin-left:6px; letter-spacing:.06em}
.cfop .explica{font-size:12px; color:var(--fraca); margin:6px 0 0; line-height:1.35}

.quem-entra{display:flex; gap:10px; margin:0 0 14px}
.quem-entra button{
  flex:1 1 0; padding:14px 10px; border-radius:10px; cursor:pointer;
  border:1px solid var(--borda); background:var(--superficie); color:var(--fraca);
  font-size:16px; font-weight:600; line-height:1.2;
}
.quem-entra button small{display:block; font-weight:400; font-size:12px; margin-top:3px; color:var(--fraca)}
.quem-entra button:hover{border-color:var(--primaria)}
.quem-entra button.ativa{
  border-color:var(--primaria); background:color-mix(in srgb,var(--primaria) 15%,var(--superficie));
  color:var(--tinta);
}
.quem-entra button.ativa small{color:var(--tinta)}
.campo[disabled]{opacity:.5; cursor:not-allowed}


.dia{border-top:1px solid var(--borda); padding-top:10px; margin-top:10px}
.dia summary{
  cursor:pointer; list-style:none; display:flex; justify-content:space-between;
  align-items:baseline; gap:10px; padding:4px 0;
}
.dia summary::-webkit-details-marker{display:none}
.dia summary .data{font-weight:600; font-size:15px}
.dia summary .resumo{font-size:12.5px; color:var(--fraca); font-variant-numeric:tabular-nums}
.dia summary:hover .data{color:var(--primaria)}
.dia[open] summary{margin-bottom:10px}
.dia .pedido:last-child{margin-bottom:4px}

.abas{display:flex; gap:8px; margin:0 0 16px}
.abas button{flex:1 1 0; padding:10px 12px; border-radius:9px; cursor:pointer; border:1px solid var(--borda); background:var(--superficie2); color:var(--fraca); font-size:14px; font-weight:600}
.abas button:hover{border-color:var(--primaria)}
.abas button.ativa{border-color:var(--primaria); background:color-mix(in srgb,var(--primaria) 15%,var(--superficie2)); color:var(--tinta)}
.cfop .explica b{color:var(--tinta); font-weight:600}
.linhas-valor{margin-top:9px; padding-top:9px; border-top:1px dashed var(--borda); font-size:13.5px}
.linhas-valor div{display:flex; justify-content:space-between; padding:1px 0; color:var(--fraca); font-variant-numeric:tabular-nums}
.linhas-valor div.forte{color:var(--tinta); font-weight:600; font-size:14px; margin-top:3px}

.barra{position:fixed; left:0; right:0; bottom:0; z-index:20; background:color-mix(in srgb,var(--superficie) 92%,transparent); backdrop-filter:blur(10px); border-top:1px solid var(--borda); padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.barra .env2{max-width:680px; margin:0 auto; display:flex; gap:12px; align-items:center; justify-content:space-between}
.barra .env2:empty{display:none}
.barra .cont{font-size:13px; color:var(--fraca); line-height:1.3}
.barra .cont b{color:var(--tinta); font-size:15px; display:block; font-variant-numeric:tabular-nums}
.barra .grupo-btn{display:flex; gap:8px}

.aviso{border:1px solid color-mix(in srgb,var(--perigo) 40%,var(--borda)); background:color-mix(in srgb,var(--perigo) 8%,transparent); border-radius:9px; padding:11px 13px; font-size:13.5px; margin-bottom:14px}
.aviso b{display:block; margin-bottom:3px}
.confirma{border:1px solid var(--primaria); background:color-mix(in srgb,var(--primaria) 8%,transparent); border-radius:10px; padding:14px 16px; margin-top:16px}
.confirma h3{margin:0 0 8px; font-size:15px}
.confirma ul{margin:0 0 12px; padding-left:18px; font-size:13.5px; line-height:1.55}
.confirma .alerta{color:var(--perigo); font-weight:600}
.girando{display:inline-block; width:13px; height:13px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:gira .7s linear infinite; vertical-align:-2px; margin-right:6px}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>

  // O CFOP é decidido pelo servidor quando o pedido nasce, pela regra:
  // FORMOSA lançada pelo Jean = 5917; FORMOSA lançada pela Tainara = 5113;
  // qualquer outro cliente = 5401. Aqui só descrevemos o que já foi decidido.
  var CFOPS = [
    {c:'5401', nome:'Venda com ST', natOp:'Venda de produção do estabelecimento quando o produto esteja sujeito a ST',
     resumo:'ICMS com substituição tributária, mais PIS e COFINS.', tributa:true, automatico:true},

  // ---------- utilidades ----------
  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function moeda(v){ return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ','); }
  function el(id){ return document.getElementById(id); }
  // A fila fica guardada no aparelho: o Jean monta ao longo do dia e só manda
  // no fim. Fechar o navegador, o celular dormir ou a página recarregar não
  // pode fazer ele perder o que já lançou.
  function chaveFila(){ return 'vds_fila_' + (estado.papel || 'x'); }

  function salvarFila(){
    try{ localStorage.setItem(chaveFila(), JSON.stringify(estado.fila)); }catch(e){}
  }

  function carregarFila(){
    var guardada = [];
    try{ guardada = JSON.parse(localStorage.getItem(chaveFila()) || '[]'); }catch(e){ guardada = []; }
    if(!Array.isArray(guardada)) guardada = [];

    // preços podem ter mudado desde ontem: refaz pelo catálogo de agora.
    // (o servidor também refaz na hora de criar — aqui é só o que ele vê)
    if(estado.catalogo){
      var porCod = {};
      estado.catalogo.produtos.forEach(function(p){ porCod[p.codigo] = p; });
      guardada.forEach(function(pedido){
        pedido.total = 0;
        (pedido.itens || []).forEach(function(i){
          var atual = porCod[i.codigo];
          if(atual){ i.preco = atual.preco; i.desc = atual.descricao; }
          pedido.total += i.qtd * i.preco;
        });
      });
    }
    estado.fila = guardada;
  }

  function infoCfop(c){ return CFOPS.filter(function(x){ return x.c === c; })[0] || CFOPS[0]; }
  function cfopDe(p){ return p.cfop || '5401'; }
  function stPedido(p){
    return p.itens.reduce(function(s,i){ return s + Math.round(i.qtd*i.preco*0.038*100)/100; }, 0);
  }
  // sob o título do sabor, repetir "SUCO DE CANA DE ACUCAR COM LIMÃO" nove vezes
  // é ruído: fica só o tamanho. Mel e biscoito mantêm o nome inteiro.
  function rotuloCurto(d){
    if(!/^SUCO DE CANA/.test(d)) return d;
    return String(d||'').replace(/^SUCO DE CANA DE ACUCAR\s*/,'').replace(/COM\s+(LIM[ÃA]O|LARANJA)\s*/,'').trim() || d;
  }
  var GRUPOS_TELA = ['Tradicional','Com limão','Com laranja','Mel e biscoito'];

  function saborDe(d){
    if(!/^SUCO DE CANA/.test(d)) return 'Mel e biscoito';
    if(/LARANJA/.test(d)) return 'Com laranja';
    if(/LIM/.test(d)) return 'Com limão';
    return 'Tradicional';
  }
  function tamanho(d){ return /330/.test(d) ? 1 : (/500/.test(d) ? 2 : 3); }

  async function api(caminho, opcoes){
    var r = await fetch(caminho, Object.assign({
      headers: {'Content-Type':'application/json'},
      credentials: 'same-origin'
    }, opcoes || {}));
    var j = null;
    try{ j = await r.json(); }catch(e){}
    if(r.status === 401){ estado.papel = null; render(); throw new Error((j && j.erro) || 'Sessão expirada.'); }
    if(!r.ok) throw new Error((j && j.erro) || ('Erro ' + r.status));
    return j;
  }

  // ---------- render ----------
  function render(){
    var raiz = el('raiz');
    if(!estado.papel){ raiz.innerHTML = telaLogin(); el('barra').innerHTML = ''; ligarLogin(); return; }
    var miolo = abas() + (
      estado.aba === 'hoje' ? telaHoje()
      : estado.aba === 'autorizar' && estado.papel === 'dona' ? telaDona()
      : telaJean()
    );
    raiz.innerHTML = '<div class="env">' + cabecalho() +
      (estado.erro ? '<div class="aviso"><b>Não deu certo</b>' + esc(estado.erro) + '</div>' : '') +
      miolo + '</div>';
    ligar();
    renderBarra();
  }

  function marca(){
    return LOGO ? '<span class="chapa"><img src="'+LOGO+'" alt="Vivenda dos Sucos" width="198" height="118"></span>' : '';
  }

  function telaLogin(){
    var q = estado.papelLogin;
    return '<div class="porta">' + marca() +
      '<h1>Pedidos do dia</h1><p>Quem vai usar o app?</p>' +
      '<div class="quem-entra">' +
        '<button class="' + (q === 'jean' ? 'ativa' : '') + '" data-quem="jean">Jean<small>anota pedidos</small></button>' +
        '<button class="' + (q === 'dona' ? 'ativa' : '') + '" data-quem="dona">Tainara<small>autoriza e emite</small></button>' +
      '</div>' +
      '<input class="campo" id="inSenha" type="password" autocomplete="current-password"' +
        (q ? '' : ' disabled') +
        ' placeholder="' + (q ? 'Senha ' + (q === 'jean' ? 'do Jean' : 'da Tainara') : 'Escolha acima primeiro') + '">' +
      '<div class="acoes"><button class="btn principal largo" id="btnEntrar"' + (q ? '' : ' disabled') + '>Entrar</button></div>' +
      (estado.erro ? '<p class="vazio" style="color:var(--perigo)">' + esc(estado.erro) + '</p>' : '') +
      '</div>';
  }

  function abas(){
    var itens = estado.papel === 'dona'
      ? [['autorizar', 'Autorizar' + (estado.pedidos.length ? ' (' + estado.pedidos.length + ')' : '')],
         ['lancar', 'Lançar'],
         ['hoje', 'Histórico']]
      : [['lancar', 'Lançar pedido'], ['hoje', 'Histórico']];
    return '<div class="abas">' + itens.map(function(i){
      return '<button class="' + (estado.aba === i[0] ? 'ativa' : '') + '" data-aba="' + i[0] + '">' + i[1] + '</button>';
    }).join('') + '</div>';
  }

  function cabecalho(){
    var sub = estado.papel === 'dona'
      ? (estado.aba === 'lancar'
          ? 'Pedido lançado por você. Na FORMOSA sai como 5113, o resto como 5401.'
          : 'Confira o que o Jean anotou e libere o que vira nota.')
      : 'Anote os pedidos aqui. A emissão sai depois, com a autorização da Tainara.';
    return '<div class="topo">' + marca() + '<h1>Pedidos do dia</h1></div>' +
      '<p class="sub">' + sub + '</p>' +
      '<div class="papel"><span class="quem">' + (estado.papel === 'dona' ? 'Autorizando' : 'Anotando pedidos') + '</span>' +
      '<button id="btnSair">sair</button></div>';
  }

  // ---------- Jean ----------
  function telaJean(){
    return blocoNome() + blocoCliente() + blocoProdutos() + blocoFila();
  }

  function blocoNome(){
    return '<div class="bloco"><p class="rot">Quem está lançando</p>' +
      '<input class="campo" id="inNome" placeholder="Seu nome" value="' + esc(estado.nome) + '"></div>';
  }

  function blocoCliente(){
    var h = '<div class="bloco"><p class="rot">Cliente</p>';
    if(estado.clienteSel){
      h += '<div class="escolhido"><div><b>' + esc(estado.clienteSel.nome) + '</b>' +
        '<span>' + esc(estado.clienteSel.local) + '</span></div>' +
        '<button class="btn miudo" id="btnTrocar">Trocar</button></div>';
    }else{
      h += '<div class="busca"><input class="campo" id="inBusca" autocomplete="off" ' +
        'placeholder="Digite parte do nome — ex.: lider castanheira" value="' + esc(estado.termo) + '">' +
        '<div class="lista" id="listaCli"></div></div>';
    }
    return h + '</div>';
  }

  function blocoProdutos(){
    if(!estado.catalogo) return '<div class="bloco"><p class="vazio">Carregando o catálogo…</p></div>';
    var grupos = {};
    estado.catalogo.produtos.forEach(function(p){
      (grupos[saborDe(p.descricao)] = grupos[saborDe(p.descricao)] || []).push(p);
    });
    var h = '<div class="bloco"><p class="rot">Quantidades</p>';
    GRUPOS_TELA.forEach(function(g){
      var itens = (grupos[g] || []).sort(function(a,b){
        // sucos por tamanho; os demais por nome
        return g === 'Mel e biscoito'
          ? String(a.descricao).localeCompare(String(b.descricao))
          : tamanho(a.descricao) - tamanho(b.descricao);
      });
      if(!itens.length) return;
      h += '<div class="grupo"><h3>' + esc(g) + '</h3>';
      itens.forEach(function(p){
        var q = estado.quantidades[p.codigo] || '';
        h += '<div class="item' + (q ? ' tem' : '') + '"><div>' +
          '<div class="nome">' + esc(rotuloCurto(p.descricao)) + '</div>' +
          '<div class="preco">' + moeda(p.preco) + ' / ' + esc(p.unidade) + '</div></div>' +
          '<input class="qtd" type="number" inputmode="numeric" min="0" step="1" data-cod="' + p.codigo +
          '" value="' + esc(q) + '" aria-label="' + esc(p.descricao) + '"></div>';
      });
      h += '</div>';
    });
    return h + '<div class="acoes"><button class="btn principal" id="btnAdd">Adicionar à fila</button>' +
      '<span class="preco" style="font-size:14px" id="soma"></span></div></div>';
  }

  function blocoFila(){
    var h = '<div class="bloco"><p class="rot">Prontos para mandar (' + estado.fila.length + ')</p>';
    if(!estado.fila.length){
      h += '<p class="vazio">Nada aqui ainda. Escolha o cliente, ponha as quantidades e toque em “Adicionar à fila”.</p>';
    }else{
      var somaFila = estado.fila.reduce(function(s,p){ return s + p.total; }, 0);
      h += '<p class="vazio" style="padding:0 0 12px">' + moeda(somaFila) + ' em produtos · ' +
        'fica guardado neste aparelho até você mandar</p>';
      estado.fila.forEach(function(p, idx){
        h += '<div class="pedido"><div class="cab"><div>' +
          '<div class="cli">' + esc(p.cliente.nome) + '</div>' +
          '<div class="loc">' + esc(p.cliente.local) + '</div></div>' +
          '<span class="selo fila">na fila</span></div><ul>';
        p.itens.forEach(function(i){ h += '<li><span>' + esc(i.desc) + '</span><b>' + i.qtd + '</b></li>'; });
        h += '</ul><div class="total"><span>Produtos</span><span>' + moeda(p.total) + '</span></div>' +
          '<div class="acoes"><button class="btn miudo" data-editar="' + idx + '">Editar</button>' +
          '<button class="btn miudo perigo" data-tirar="' + idx + '">Remover</button></div></div>';
      });
    }
    return h + '</div>';
  }

  // ---------- histórico ----------
  function telaHoje(){
    var h = '<div class="bloco"><p class="rot">Histórico — últimos 30 dias</p>';
    if(estado.carregandoHoje) return h + '<p class="vazio">Buscando…</p></div>';

    var grupos = estado.hoje;
    if(!grupos.length){
      return h + '<p class="vazio">Nenhum pedido nos últimos 30 dias.</p>' +
        '<div class="acoes"><button class="btn miudo" id="btnHoje">Atualizar</button></div></div>';
    }

    var soma = grupos.reduce(function(s,g){ return s + g.total; }, 0);
    var qtd = grupos.reduce(function(s,g){ return s + g.pedidos.length; }, 0);
    h += '<p class="vazio" style="padding:0 0 12px">' + qtd + (qtd === 1 ? ' pedido' : ' pedidos') +
      ' · ' + moeda(soma) + ' em produtos</p>';

    grupos.forEach(function(g, idx){
      h += '<details class="dia"' + (idx === 0 ? ' open' : '') + '><summary>' +
        '<span class="data">' + esc(diaBr(g.dia)) + '</span>' +
        '<span class="resumo">' + g.pedidos.length + (g.pedidos.length === 1 ? ' pedido' : ' pedidos') +
        ' · ' + moeda(g.total) + '</span></summary>';
      g.pedidos.forEach(function(p){
        h += '<div class="pedido"><div class="cab"><div>' +
          '<div class="cli">' + esc(p.cliente) + '</div>' +
          '<div class="loc">venda ' + p.codigo + ' · CFOP ' + esc(p.cfop) +
            (p.quando ? ' · ' + esc(horaDe(p.quando)) : '') + '</div>' +
          '</div><span class="selo ' + seloDoEstado(p.estado) + '">' + esc(rotuloEstado(p.estado)) + '</span></div><ul>';
        p.itens.forEach(function(i){ h += '<li><span>' + esc(i.desc) + '</span><b>' + i.qtd + '</b></li>'; });
        h += '</ul><div class="total"><span>Produtos</span><span>' + moeda(p.total) + '</span></div>' +
          '<div class="nota">' + esc(p.detalhe) + '</div></div>';
      });
      h += '</details>';
    });

    return h + '<div class="acoes"><button class="btn miudo" id="btnHoje">Atualizar</button></div></div>';
  }

  function diaBr(iso){
    var p = String(iso).split('-');
    if(p.length !== 3) return iso;
    var hoje = new Date().toISOString().slice(0,10);
    var etiqueta = p[2] + '/' + p[1];
    if(iso === hoje) return 'Hoje, ' + etiqueta;
    return etiqueta;
  }

  function rotuloEstado(e){
    return {aguardando:'aguardando', autorizada:'autorizada', emitida:'emitida',
            cancelada:'cancelada', rascunho:'rascunho'}[e] || e;
  }
  function seloDoEstado(e){
    return {aguardando:'anotado', autorizada:'autorizado', emitida:'emitida',
            cancelada:'erro', rascunho:'fila'}[e] || 'fila';
  }
  function horaDe(s){
    var m = String(s).match(/(\d{2}):(\d{2})/);
    return m ? m[1] + ':' + m[2] : '';
  }

  // ---------- Tainara ----------
  function telaDona(){
    if(!estado.pedidos) return '<div class="bloco"><p class="vazio">Carregando…</p></div>';
    var h = '<div class="bloco' + (estado.pedidos.length ? ' destaque' : '') + '">' +
      '<p class="rot">Aguardando sua autorização (' + estado.pedidos.length + ')</p>';
    if(!estado.pedidos.length){
      h += '<p class="vazio">Nenhum pedido esperando. Quando o Jean mandar, aparece aqui.</p>';
    }else{
      var soma = estado.pedidos.reduce(function(s,p){ return s + p.totalProdutos; }, 0);
      h += '<p class="vazio" style="padding-bottom:12px">' + estado.pedidos.length +
        (estado.pedidos.length === 1 ? ' pedido' : ' pedidos') + ' · ' + moeda(soma) + ' em produtos</p>';
      estado.pedidos.forEach(function(p){ h += cartao(p); });
      h += '<div class="acoes"><button class="btn miudo" id="btnTodos">Autorizar todos</button>' +
        '<button class="btn miudo" id="btnRecarregar">Atualizar lista</button></div>';
      h += painelConfirmacao();
    }
    h += '</div>';
    if(estado.resultados.length) h += blocoResultados();
    if(estado.recusados.length) h += blocoRecusados();
    return h;
  }

  function cartao(p){
    var d = estado.decisoes[p.codigo];
    var classe = 'pedido ' + (d === 'autorizar' ? 'vai-sim' : d === 'recusar' ? 'vai-nao' : d === 'excluir' ? 'vai-fora' : 'pendendo');
    var atual = cfopDe(p);
    var info = infoCfop(atual);
    // o ST vem calculado pelo eGestor, não estimado aqui: ele reflete o grupo
    // de tributos que está de fato aplicado na venda
    var st = typeof p.totalST === 'number' ? p.totalST : (info.tributa ? stPedido(p) : 0);

    var h = '<div class="' + classe + '"><div class="cab"><div>' +
      '<div class="cli">' + esc(p.cliente.nome) + '</div>' +
      '<div class="loc">orçamento ' + p.codigo + (p.por ? ' · ' + esc(p.por) : '') + '</div></div>' +
      selo(p, d) + '</div><ul>';
    p.itens.forEach(function(i){ h += '<li><span>' + esc(i.desc) + '</span><b>' + i.qtd + '</b></li>'; });
    h += '</ul>';

    var em = p.emissao || {pode:true};
    h += '<div class="cfop"><p class="rot">CFOP ' + esc(atual) + ' · ' + esc(info.nome) +
      (em.pode ? '' : ' <span class="marcaTela">precisa de ajuste</span>') + '</p>' +
      '<p class="explica"><b>' + esc(info.natOp) + '.</b> ' + esc(info.resumo) + '</p>' +
      (em.pode ? '' : '<p class="explica" style="color:var(--perigo)">' + esc(em.motivo) + '</p>') +
      '</div>';

    h += '<div class="linhas-valor">' +
      '<div><span>Produtos</span><span>' + moeda(p.totalProdutos) + '</span></div>' +
      '<div><span>ICMS-ST</span><span>' + (info.tributa ? moeda(st) : 'isento') + '</span></div>' +
      '<div class="forte"><span>Total da nota</span><span>' + moeda(p.totalProdutos + st) + '</span></div></div>';

    h += '<div class="acoes">' +
      '<button class="btn miudo' + (d === 'autorizar' ? ' marcado' : '') + '" data-sim="' + p.codigo + '">Autorizar</button>' +
      '<button class="btn miudo' + (d === 'recusar' ? ' marcado-nao' : '') + '" data-nao="' + p.codigo + '">Recusar</button>' +
      '<button class="btn miudo perigo' + (d === 'excluir' ? ' marcado-nao' : '') + '" data-fora="' + p.codigo + '" style="margin-left:auto">Excluir</button>' +
      '</div></div>';
    return h;
  }

  function selo(p, d){
    if(d === 'autorizar') return '<span class="selo autorizado">vai autorizar</span>';
    if(d === 'recusar') return '<span class="selo erro">vai recusar</span>';
    if(d === 'excluir') return '<span class="selo erro">vai apagar</span>';
    return '<span class="selo anotado">aguardando você</span>';
  }

  function contas(){
    var emitir = [], tela = [], recusar = [], apagar = [];
    estado.pedidos.forEach(function(p){
      var d = estado.decisoes[p.codigo];
      if(d === 'autorizar'){ ((p.emissao && p.emissao.pode !== false) ? emitir : tela).push(p); }
      else if(d === 'recusar') recusar.push(p);
      else if(d === 'excluir') apagar.push(p);
    });
    return {emitir:emitir, tela:tela, recusar:recusar, apagar:apagar,
            total: emitir.length + tela.length + recusar.length + apagar.length};
  }

  function painelConfirmacao(){
    if(!estado.confirmando) return '';
    var c = contas();
    var h = '<div class="confirma"><h3>Confere antes de eu executar</h3><ul>';
    if(c.emitir.length) h += '<li><b class="alerta">' + c.emitir.length + ' nota(s) fiscal(is) serão emitidas agora</b> pela API, em produção: ' +
      c.emitir.map(function(p){ return esc(p.cliente.nome) + ' (' + moeda(p.totalProdutos + stPedido(p)) + ')'; }).join('; ') + '</li>';
    if(c.tela.length) h += '<li><b>' + c.tela.length + ' não sai(em) automática(s)</b> — ' +
      c.tela.map(function(p){ return esc(p.cliente.nome) + ' (CFOP ' + cfopDe(p) + ')'; }).join('; ') +
      '. Veja o aviso em vermelho no cartão: se for troca de grupo de tributos, faça no eGestor e volte aqui — ' +
      'aí a nota sai sozinha.</li>';
    if(c.recusar.length) h += '<li>' + c.recusar.length + ' recusado(s) — ficam registrados como orçamento.</li>';
    if(c.apagar.length) h += '<li><b class="alerta">' + c.apagar.length + ' apagado(s) de vez</b>, sem volta.</li>';
    h += '</ul><div class="acoes"><button class="btn principal" id="btnConfirmar">Confirmar e executar</button>' +
      '<button class="btn" id="btnCancelar">Cancelar</button></div></div>';
    return h;
  }

  function blocoResultados(){
    var h = '<div class="bloco"><p class="rot">Resultado</p>';
    estado.resultados.forEach(function(r){
      var cls = r.tipo === 'emitida' ? 'emitida' : r.tipo === 'erro' ? 'erro' : 'autorizado';
      h += '<div class="pedido"><div class="cab"><div><div class="cli">' + esc(r.cliente) + '</div>' +
        '<div class="loc">orçamento ' + r.codigo + '</div></div>' +
        '<span class="selo ' + cls + '">' + esc(r.rotulo) + '</span></div>' +
        (r.detalhe ? '<div class="nota">' + esc(r.detalhe) + '</div>' : '') + '</div>';
    });
    return h + '</div>';
  }

  function blocoRecusados(){
    var h = '<div class="bloco"><p class="rot">Recusados (' + estado.recusados.length + ')</p>';
    estado.recusados.forEach(function(p){
      h += '<div class="pedido"><div class="cab"><div><div class="cli">' + esc(p.cliente.nome) + '</div>' +
        '<div class="loc">orçamento ' + p.codigo + '</div></div><span class="selo fila">recusado</span></div>' +
        '<div class="total"><span>Produtos</span><span>' + moeda(p.totalProdutos) + '</span></div></div>';
    });
    return h + '</div>';
  }

  function renderBarra(){
    var b = el('barra');
    if(estado.aba === 'hoje'){ b.innerHTML = ''; return; }
    if(estado.papel === 'dona' && estado.aba === 'autorizar'){
      var c = contas();
      b.innerHTML = '<div class="cont"><b>' + c.total + (c.total === 1 ? ' mudança' : ' mudanças') + '</b>' +
        (c.emitir.length ? c.emitir.length + ' nota(s) para emitir' : c.total ? 'toque em revisar' : 'nada marcado ainda') + '</div>' +
        '<div class="grupo-btn"><button class="btn principal" id="btnRevisar"' +
        (c.total && !estado.ocupado ? '' : ' disabled') + '>' +
        (estado.ocupado ? '<span class="girando"></span>Executando…' : 'Revisar e executar') + '</button></div>';
      var br = el('btnRevisar');
      if(br) br.addEventListener('click', function(){ estado.confirmando = true; render(); window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}); });
    }else{
      var n = estado.fila.length;
      b.innerHTML = '<div class="cont"><b>' + n + (n === 1 ? ' pedido' : ' pedidos') + '</b>' +
        (n ? 'pronto pra mandar' : 'na fila') + '</div>' +
        '<div class="grupo-btn"><button class="btn principal" id="btnMandar"' +
        (n && !estado.ocupado ? '' : ' disabled') + '>' +
        (estado.ocupado ? '<span class="girando"></span>Mandando…' : 'Mandar para autorização') + '</button></div>';
      var bm = el('btnMandar');
      if(bm) bm.addEventListener('click', mandar);
    }
  }

  // ---------- eventos ----------
  function ligarLogin(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-quem]'), function(bt){
      bt.addEventListener('click', function(){
        estado.papelLogin = bt.getAttribute('data-quem');
        estado.erro = '';
        try{ localStorage.setItem('vds_papel_login', estado.papelLogin); }catch(e){}
        render();
      });
    });

    var s = el('inSenha'), b = el('btnEntrar');
    if(!estado.papelLogin) return;

    function entrar(){
      if(!s.value){ s.focus(); return; }
      estado.erro = '';
      b.disabled = true; b.textContent = 'Entrando…';
      api('/api/login', {method:'POST', body: JSON.stringify({papel: estado.papelLogin, senha: s.value})})
        .then(function(r){ estado.papel = r.papel; iniciar(); })
        .catch(function(e){ estado.erro = e.message; render(); });
    }
    b.addEventListener('click', entrar);
    s.addEventListener('keydown', function(e){ if(e.key === 'Enter') entrar(); });
    s.focus();
  }

  function ligar(){
    var sair = el('btnSair');
    if(sair) sair.addEventListener('click', function(){
      api('/api/login', {method:'DELETE'}).finally(function(){
        estado.papel = null; estado.decisoes = {}; estado.aba = "autorizar"; render();
      });
    });

    var inNome = el('inNome');
    if(inNome) inNome.addEventListener('input', function(){
      estado.nome = inNome.value;
      try{ localStorage.setItem('vds_nome', estado.nome); }catch(e){}
    });

    var inBusca = el('inBusca');
    if(inBusca){
      inBusca.addEventListener('input', function(){ estado.termo = inBusca.value; desenharLista(); });
      desenharLista();
    }

    var bt = el('btnTrocar');
    if(bt) bt.addEventListener('click', function(){ estado.clienteSel = null; estado.termo = ''; render(); });

    Array.prototype.forEach.call(document.querySelectorAll('.qtd'), function(inp){
      inp.addEventListener('input', function(){
        var v = parseInt(inp.value, 10), cod = inp.getAttribute('data-cod');
        if(!v || v < 0) delete estado.quantidades[cod]; else estado.quantidades[cod] = v;
        inp.closest('.item').classList.toggle('tem', !!estado.quantidades[cod]);
        mostrarSoma();
      });
    });
    mostrarSoma();

    var add = el('btnAdd');
    if(add) add.addEventListener('click', adicionar);

    cada('[data-tirar]', function(elm){
      estado.fila.splice(Number(elm.getAttribute('data-tirar')), 1); salvarFila(); render();
    });
    cada('[data-editar]', function(elm){
      var p = estado.fila.splice(Number(elm.getAttribute('data-editar')), 1)[0]; salvarFila();
      estado.clienteSel = p.cliente;
      estado.quantidades = {};
      p.itens.forEach(function(i){ estado.quantidades[i.codigo] = i.qtd; });
      render(); window.scrollTo({top:0, behavior:'smooth'});
    });

    cada('[data-sim]', function(elm){ marcar(elm.getAttribute('data-sim'), 'autorizar'); });
    cada('[data-nao]', function(elm){ marcar(elm.getAttribute('data-nao'), 'recusar'); });
    cada('[data-fora]', function(elm){ marcar(elm.getAttribute('data-fora'), 'excluir'); });
    cada('[data-aba]', function(elm){
      estado.aba = elm.getAttribute('data-aba');
      estado.confirmando = false;
      render();
      if(estado.aba === 'hoje') carregarHoje();
    });

    var bh = el('btnHoje');
    if(bh) bh.addEventListener('click', carregarHoje);

    var todos = el('btnTodos');
    if(todos) todos.addEventListener('click', function(){
      estado.pedidos.forEach(function(p){ estado.decisoes[p.codigo] = 'autorizar'; });
      render();
    });
    var rec = el('btnRecarregar');
    if(rec) rec.addEventListener('click', carregarPedidos);

    var conf = el('btnConfirmar');
    if(conf) conf.addEventListener('click', executar);
    var canc = el('btnCancelar');
    if(canc) canc.addEventListener('click', function(){ estado.confirmando = false; render(); });
  }

  function cada(sel, fn){
    Array.prototype.forEach.call(document.querySelectorAll(sel), function(elm){
      elm.addEventListener('click', function(){ fn(elm); });
    });
  }

  function marcar(cod, valor){
    if(estado.decisoes[cod] === valor) delete estado.decisoes[cod]; else estado.decisoes[cod] = valor;
    estado.confirmando = false;
    render();
  }

  function mostrarSoma(){
    var e = el('soma');
    if(!e || !estado.catalogo) return;
    var t = 0, n = 0;
    estado.catalogo.produtos.forEach(function(p){
      var q = estado.quantidades[p.codigo];
      if(q){ t += q * p.preco; n++; }
    });
    e.textContent = t > 0 ? moeda(t) + ' em ' + n + (n === 1 ? ' produto' : ' produtos') : '';
  }

  function desenharLista(){
    var cx = el('listaCli');
    if(!cx || !estado.catalogo) return;
    var t = estado.termo.trim().toLowerCase();
    if(t.length < 2){ cx.innerHTML = ''; return; }
    var palavras = t.split(/\s+/);
    var achados = estado.catalogo.clientes.filter(function(c){
      var alvo = (c.nome + ' ' + c.fantasia + ' ' + c.local + ' ' + c.cpfcnpj).toLowerCase();
      return palavras.every(function(p){ return alvo.indexOf(p) >= 0; });
    }).slice(0, 12);
    if(!achados.length){ cx.innerHTML = '<div class="opt"><span>Nenhum cliente com esse nome no cadastro.</span></div>'; return; }
    cx.innerHTML = achados.map(function(c){
      var rotulo = c.fantasia && c.fantasia !== c.nome ? c.nome + '  (' + c.fantasia + ')' : c.nome;
      return '<button class="opt" data-cli="' + c.codigo + '"><b>' + esc(rotulo) + '</b><span>' + esc(c.local) + '</span></button>';
    }).join('');
    Array.prototype.forEach.call(cx.querySelectorAll('[data-cli]'), function(b){
      b.addEventListener('click', function(){
        var cod = Number(b.getAttribute('data-cli'));
        estado.clienteSel = estado.catalogo.clientes.filter(function(c){ return c.codigo === cod; })[0] || null;
        render();
      });
    });
  }

  function adicionar(){
    if(!estado.clienteSel){ alert('Escolha o cliente primeiro.'); return; }
    var itens = [], total = 0;
    estado.catalogo.produtos.forEach(function(p){
      var q = estado.quantidades[p.codigo];
      if(q > 0){ itens.push({codigo:p.codigo, desc:p.descricao, qtd:q, preco:p.preco}); total += q * p.preco; }
    });
    if(!itens.length){ alert('Ponha a quantidade de pelo menos um produto.'); return; }
    estado.fila.push({cliente: estado.clienteSel, itens: itens, total: total});
    salvarFila();
    estado.clienteSel = null; estado.quantidades = {}; estado.termo = '';
    render(); window.scrollTo({top:0, behavior:'smooth'});
  }

  async function mandar(){
    if(!estado.fila.length) return;
    estado.ocupado = true; estado.erro = ''; renderBarra();
    var enviados = 0;
    try{
      while(estado.fila.length){
        var p = estado.fila[0];
        await api('/api/pedidos', {method:'POST', body: JSON.stringify({
          codContato: p.cliente.codigo,
          por: (estado.nome || 'Jean').trim(),
          itens: p.itens.map(function(i){ return {codProduto:i.codigo, quant:i.qtd}; })
        })});
        estado.fila.shift();
        salvarFila();
        enviados++;
      }
      alert(enviados + (enviados === 1 ? ' pedido enviado' : ' pedidos enviados') + ' para a Tainara autorizar.');
    }catch(e){
      estado.erro = e.message + (enviados ? ' — ' + enviados + ' já tinham ido.' : '');
    }finally{
      estado.ocupado = false; render();
    }
  }

  async function executar(){
    var c = contas();
    if(!c.total) return;
    estado.ocupado = true; estado.confirmando = false; estado.erro = ''; estado.resultados = [];
    render();

    for(var i = 0; i < estado.pedidos.length; i++){
      var p = estado.pedidos[i];
      var d = estado.decisoes[p.codigo];
      if(!d) continue;
      try{
        if(d === 'excluir'){
          await api('/api/pedidos?codigo=' + p.codigo, {method:'DELETE'});
          estado.resultados.push({codigo:p.codigo, cliente:p.cliente.nome, tipo:'apagado', rotulo:'apagado'});
        }else if(d === 'recusar'){
          await api('/api/autorizar', {method:'POST', body: JSON.stringify({codigo:p.codigo, acao:'recusar'})});
          estado.resultados.push({codigo:p.codigo, cliente:p.cliente.nome, tipo:'recusado', rotulo:'recusado'});
        }else{
          var r = await api('/api/autorizar', {method:'POST', body: JSON.stringify({codigo:p.codigo})});
          if(r.resultado === 'emitida'){
            estado.resultados.push({codigo:p.codigo, cliente:p.cliente.nome, tipo:'emitida',
              rotulo:'NF-e ' + r.numNota, detalhe:'Autorizada. Chave ' + r.chave});
          }else if(r.resultado === 'aguardando-tela'){
            estado.resultados.push({codigo:p.codigo, cliente:p.cliente.nome, tipo:'tela',
              rotulo:'CFOP ' + r.cfop, detalhe:r.aviso});
          }else{
            estado.resultados.push({codigo:p.codigo, cliente:p.cliente.nome, tipo:'erro',
              rotulo:'rejeitada', detalhe:(r.cStat ? r.cStat + ' — ' : '') + (r.xMotivo || 'a SEFAZ não autorizou')});
          }
        }
      }catch(e){
        estado.resultados.push({codigo:p.codigo, cliente:p.cliente.nome, tipo:'erro', rotulo:'erro', detalhe:e.message});
      }
    }

    estado.decisoes = {}; estado.ocupado = false;
    await carregarPedidos();
  }

  // ---------- carga ----------
  async function carregarHoje(){
    estado.carregandoHoje = true; estado.erro = ''; render();
    try{
      var r = await api('/api/historico?dias=' + estado.dias);
      estado.hoje = r.grupos || [];
    }catch(e){ estado.erro = e.message; }
    estado.carregandoHoje = false;
    render();
  }

  async function carregarPedidos(){
    try{
      var r = await api('/api/pedidos');
      estado.pedidos = r.pedidos || [];
      estado.recusados = r.recusados || [];
    }catch(e){ estado.erro = e.message; }
    render();
  }

  async function iniciar(){
    try{ estado.nome = localStorage.getItem('vds_nome') || ''; }catch(e){}
    estado.erro = '';
    if(estado.papel !== 'dona') estado.aba = 'lancar';
    carregarFila();   // o que ficou de antes volta na tela
    render();
    try{
      estado.catalogo = await api('/api/catalogo');
      carregarFila(); // agora com o catálogo, reconfere os preços
    }catch(e){ estado.erro = e.message; }
    if(estado.papel === 'dona') await carregarPedidos(); else render();
  }

  // o mesmo aparelho costuma ser da mesma pessoa: deixa pré-escolhido
  try{ estado.papelLogin = localStorage.getItem('vds_papel_login') || ''; }catch(e){}

  api('/api/login').then(function(r){
    estado.papel = r.papel;
    if(estado.papel) iniciar(); else render();
  }).catch(function(){ render(); });
})();
</script>
</body>
</html>
